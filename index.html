<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arrest Depth Atlas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atlas">
<meta name="theme-color" content="#06070a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
html{background:#06070a}
/* Layout: one narrow column of glass panels over a dark field, a sticky header, a scrolling icon nav at the bottom, and an original character standing behind the content. Mirrors the structure of the user's PLAYER index. */
:root{
  --ink:#06070a; --panel:rgba(13,15,19,.74); --panel2:rgba(18,21,27,.84); --panel3:rgba(27,31,40,.9);
  --line:#1f242c; --line2:#2b313b; --tx:#e6e9ee; --dim:#a0a8b4; --faint:#7d8696;
  --c-start:#e6e9ee; --c-cells:#45b6d8; --c-data:#9b8cf0; --c-method:#d99544; --c-answer:#57b89a; --c-limits:#e0645f; --c-papers:#4fbf94; --c-terms:#d9a94e;
  --r:10px;
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,"Cascadia Mono","Roboto Mono",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--ink);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
.bgimg{position:fixed;inset:0;z-index:-3;background-size:cover;background-position:center;opacity:0;transition:opacity .5s;pointer-events:none}
.bgimg.show{opacity:1}
.field{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(60vmax 50vmax at 85% 8%,rgba(69,182,216,.13),transparent 62%),radial-gradient(55vmax 45vmax at 5% 70%,rgba(155,140,240,.10),transparent 64%),radial-gradient(50vmax 40vmax at 60% 100%,rgba(217,149,68,.09),transparent 66%)}
.field::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;opacity:.3;
  -webkit-mask-image:radial-gradient(ellipse 90% 55% at 50% 0%,#000,transparent 75%);mask-image:radial-gradient(ellipse 90% 55% at 50% 0%,#000,transparent 75%)}
.scrim{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(6,7,10,.55),rgba(6,7,10,.78) 55%,rgba(6,7,10,.9))}
body.has-bg .scrim{background:linear-gradient(180deg,rgba(6,7,10,.72),rgba(6,7,10,.86) 50%,rgba(6,7,10,.94))}

/* character */
.sable{position:fixed;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));height:min(82vh,700px);aspect-ratio:320/560;z-index:-1;pointer-events:none;opacity:.5}
.sable svg{display:block;height:100%;width:auto}
body.no-sable .sable{display:none}
@media (max-width:640px){.sable{opacity:.24;height:56vh;right:-2vw}}

/* type */
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:20px;line-height:1.25;text-wrap:balance}
h2{font-size:15px}h3{font-size:13.5px}
p{margin:0 0 9px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sub{color:var(--dim);font-size:13.5px}
.tiny{font-size:12px;color:var(--faint);line-height:1.5}
a{color:var(--c-cells);text-decoration:none;border-bottom:1px solid rgba(69,182,216,.32)}
a:hover{border-bottom-color:var(--c-cells)}
.display{font-family:var(--display);font-style:italic;font-weight:600;font-size:27px;line-height:1.15;letter-spacing:0;text-wrap:balance}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(6,7,10,.95),rgba(6,7,10,.82));backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border-bottom:1px solid var(--line)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(69,182,216,.55),rgba(155,140,240,.55),rgba(217,149,68,.55),rgba(79,191,148,.55),transparent)}
.hbar{max-width:760px;margin:0 auto;padding:11px 0;display:flex;align-items:center;gap:11px}
.mark{width:32px;height:32px;flex:none;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center}
.htitle{flex:1;min-width:0}
.htitle .t{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.htitle .s{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstat{font-family:var(--mono);text-align:right}
.hstat b{display:block;font-size:16px;line-height:1}
.hstat span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

.wrap{max-width:760px;margin:0 auto}
section.view{display:none;padding:18px 0 28px;animation:fade .22s ease}
section.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.shead{margin-bottom:12px}
.shead .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent,var(--dim));margin-bottom:6px}

/* panels */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;position:relative;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card::after{content:"";position:absolute;left:14%;right:14%;top:-1px;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent,#fff) 60%,transparent),transparent);pointer-events:none}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.chead .dot{width:6px;height:6px;border-radius:50%;background:var(--accent,var(--dim));box-shadow:0 0 9px -1px var(--accent,transparent);flex:none}
.chead .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.chead .r{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.08em}

/* progress */
.strip{display:flex;gap:2px;height:26px;align-items:flex-end}
.strip i{flex:1;height:9px;border-radius:2px;background:var(--panel3);border:1px solid var(--line)}
.strip i.done{height:26px;background:var(--accent,var(--dim));border-color:transparent;box-shadow:0 0 11px -2px color-mix(in srgb,var(--accent,#888) 75%,transparent)}
.rings{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px}
.ringbox{text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 2px 9px;cursor:pointer;color:inherit}
.ringbox svg{display:block;margin:0 auto 5px}
.ringbox .v{font-family:var(--mono);font-size:13px;font-weight:600;line-height:1}
.ringbox .l{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:4px}

/* rows */
.rows{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel);margin-bottom:12px}
.row{border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.rowhead{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;user-select:none;width:100%;background:none;border:0;border-radius:0;color:inherit;text-align:left;font:inherit;text-transform:none;letter-spacing:0}
.rowhead:active{background:var(--panel2)}
.idx{font-family:var(--mono);font-size:10px;color:var(--faint);width:24px;flex:none}
.ttl{flex:1;min-width:0;font-size:14px;font-weight:500;line-height:1.35}
.ttl em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:3px;font-weight:400}
.tick{width:22px;height:22px;flex:none;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:transparent;padding:0;cursor:pointer}
.tick.on{background:var(--accent,var(--dim));border-color:transparent;color:var(--ink);font-weight:700;box-shadow:0 0 13px -3px color-mix(in srgb,var(--accent,#888) 80%,transparent)}
.caret{width:9px;height:9px;flex:none;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(45deg);transition:transform .2s;margin:-4px 2px 0}
.row.open .caret{transform:rotate(-135deg);margin-top:2px}
.rowbody{display:none;padding:2px 14px 14px;background:var(--panel2);border-top:1px solid var(--line)}
.row.open .rowbody{display:block}
.rowbody p{font-size:14px;color:var(--tx);max-width:68ch}
.rowbody ul{margin:0 0 9px;padding-left:18px;font-size:14px;max-width:68ch}.rowbody li{margin-bottom:4px}
.lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent,var(--dim));margin:12px 0 4px;display:block}
.note{margin:10px 0 0;padding:9px 11px;border-radius:7px;background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--accent,var(--dim))}
.note .h{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent,var(--dim));margin-bottom:3px}
.note p{margin:0;font-size:13px;color:var(--dim)}
.cite{font-family:var(--mono);font-size:11px;border-bottom:0;padding:0 2px;color:var(--c-papers);cursor:pointer}
.tag{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap;margin-right:4px}
.tag.a{color:var(--accent,var(--dim));border-color:color-mix(in srgb,var(--accent,#888) 40%,transparent);background:color-mix(in srgb,var(--accent,#888) 11%,transparent)}
.tag.ok{color:var(--c-papers);border-color:rgba(79,191,148,.4);background:rgba(79,191,148,.1)}
.tag.chk{color:var(--c-method);border-color:rgba(217,149,68,.4);background:rgba(217,149,68,.1)}

/* tables */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:12px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);text-align:left;padding:9px 11px;border-bottom:1px solid var(--line2);white-space:nowrap;background:rgba(16,19,24,.96)}
td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
tr:last-child td{border-bottom:0}
td:first-child{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap}

/* controls */
button,.btn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--panel2);color:var(--tx);border:1px solid var(--line2);border-radius:7px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--tx);color:var(--ink);border-color:transparent;font-weight:700}
button.gh{background:transparent;color:var(--dim)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],input[type=search],textarea{width:100%;background:rgba(12,15,20,.7);border:1px solid var(--line2);border-radius:7px;color:var(--tx);font-family:var(--sans);font-size:14px;padding:10px 11px}
textarea{font-family:var(--mono);font-size:12px;min-height:70px;resize:vertical}
input:focus-visible,button:focus-visible,textarea:focus-visible,a:focus-visible,.ringbox:focus-visible,.nb:focus-visible{outline:2px solid var(--accent,var(--c-cells));outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--dim);cursor:pointer}
.chip.on{background:color-mix(in srgb,var(--accent,#888) 18%,transparent);border-color:color-mix(in srgb,var(--accent,#888) 55%,transparent);color:var(--tx)}
input[type=range]{width:100%;accent-color:var(--accent,var(--c-cells));margin:6px 0}

/* depth line & pipeline & bars */
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch;margin:2px 0 10px}
.flow div{flex:1 1 92px;min-width:0;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:9px 9px 10px;font-size:12px;line-height:1.35}
.flow b{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent,var(--dim));margin-bottom:4px}
.bar{height:7px;border-radius:4px;background:var(--panel3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent,var(--dim));transition:width .45s ease}
.barrow{display:grid;grid-template-columns:96px 1fr 38px;gap:9px;align-items:center;margin-bottom:9px}
.barrow .n{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--dim);text-transform:uppercase}
.barrow .v{font-family:var(--mono);font-size:11px;text-align:right}
.big{font-family:var(--display);font-size:24px;font-style:italic;font-weight:600;line-height:1.1;margin:2px 0 4px}
svg text{font-family:var(--mono)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.cols2{grid-template-columns:1fr}}
.qrow{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow .tx{flex:1;min-width:0;font-size:14px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:55;background:linear-gradient(0deg,rgba(6,7,10,.97),rgba(6,7,10,.86));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nbar{display:flex;overflow-x:auto;justify-content:safe center;padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));scrollbar-width:none;gap:2px}
.nbar::-webkit-scrollbar{display:none}
.nb{flex:0 0 auto;min-width:66px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 6px 5px;border:0;border-radius:9px;background:none;color:var(--faint);cursor:pointer;text-transform:none;letter-spacing:0}
.nb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nb .lb{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase}
.nb.on{color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--panel3);border:1px solid var(--line2);border-radius:8px;padding:9px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
.pcard .meta{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px}
.doi{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:11px;letter-spacing:.04em}
</style>
</head>
<body>
<style>
.heroimg{position:relative;min-height:calc(100svh - 196px);max-height:760px;border-radius:14px;overflow:hidden;border:1px solid var(--line2);background:radial-gradient(70% 55% at 55% 38%,rgba(69,182,216,.20),transparent 70%),radial-gradient(60% 40% at 80% 60%,rgba(217,149,68,.16),transparent 70%),#070a10;margin-bottom:14px;display:flex;flex-direction:column;justify-content:space-between}
.hi-art{position:absolute;inset:0;background-size:cover;background-position:center;display:flex;align-items:flex-end;justify-content:center}
.hi-art svg{height:94%;width:auto;display:block}
.heroimg::before,.heroimg::after{content:"";position:absolute;left:0;right:0;z-index:1;pointer-events:none}
.heroimg::before{top:0;height:42%;background:linear-gradient(180deg,rgba(6,7,10,.82),transparent)}
.heroimg::after{bottom:0;height:30%;background:linear-gradient(0deg,rgba(6,7,10,.9),transparent)}
.hi-title{position:relative;z-index:2;padding:20px 18px 0;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.hi-name{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(36px,10vw,56px);line-height:1;margin-top:8px;letter-spacing:0}
.hi-cue{position:relative;z-index:2;text-align:center;padding:0 0 16px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.hi-cue i{display:block;width:9px;height:9px;margin:8px auto 0;border-right:1.5px solid var(--dim);border-bottom:1.5px solid var(--dim);transform:rotate(45deg);animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%,100%{transform:translateY(0) rotate(45deg);opacity:.5}50%{transform:translateY(6px) rotate(45deg);opacity:1}}
body.on-start .sable{opacity:0}
.sable{transition:opacity .3s}
.rings.eight{grid-template-columns:repeat(4,1fr)}
#dout .barrow .n{text-transform:none;font-size:11px}
.sable svg .eye{animation:blink 6s infinite}
@keyframes blink{0%,94%,100%{opacity:1}96%{opacity:.15}}
.sable svg .glow{animation:pulse 4.5s ease-in-out infinite;transform-origin:262px 262px}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
.lines{display:grid;gap:6px}
.lnk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);border-bottom:1px solid var(--line);color:var(--tx)}
.lnk:hover{border-color:var(--line2)}
.lnk b{display:block;font-size:13.5px;font-weight:500}
.lnk span{display:block;font-size:12px;color:var(--faint)}
.lnk .ar{margin-left:auto;font-family:var(--mono);color:var(--accent,var(--dim));flex:none}
pre.code{margin:8px 0;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(8,10,14,.85);font-family:var(--mono);font-size:11.5px;line-height:1.55;overflow-x:auto;color:var(--tx)}
.hero{padding:18px 16px 16px}
.depthbar{height:14px;border-radius:7px;background:linear-gradient(90deg,#45b6d8,#57b89a 38%,#d9a94e 66%,#e0645f);position:relative;margin:26px 0 8px}
.depthbar .pin{position:absolute;top:-7px;width:3px;height:28px;background:var(--tx);border-radius:2px;box-shadow:0 0 10px rgba(255,255,255,.55);transition:left .15s}
.depthlab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);gap:6px}
.depthlab span{flex:1}.depthlab span:nth-child(2){text-align:center}.depthlab span:last-child{text-align:right}
.mini td:first-child{white-space:normal}
.calc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.calc input{width:110px}
.search{margin-bottom:10px}
.empty{padding:18px;text-align:center;color:var(--faint);font-size:13px}
.bk{display:block;width:100%;margin:6px 0 0}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sw button{width:54px;height:54px;padding:0;border-radius:9px;border:1px solid var(--line2);background-size:cover;background-position:center}
</style>
<div class="bgimg" id="bgimg"></div>
<div class="field"></div>
<div class="scrim"></div>
<div class="sable" aria-hidden="true">

const ROWS={
cells:[
{id:'c1',t:'Melanoma cells inside one tumour are not all the same',e:'Cell states',b:`<p>Some melanoma cells divide fast and look like normal pigment cells (<b>MITF-high</b>). Others divide slowly, move a lot, invade, and are harder to treat. The second kind is linked to a <b>mesenchymal</b> state {{3,4}}.</p><p>Pozniak and colleagues mapped melanoma cell by cell and found a mesenchymal state driven by the transcription factor <b>TCF4</b>. It goes with a weaker response to immunotherapy {{5}}. This is the state the thesis is about.</p><div class="note"><div class="h">Say it simply</div><p>Same tumour, different personalities. The thesis asks why stressed, stopped cells end up with the slow, mesenchymal one.</p></div>`},
{id:'c2',t:'Three words for "stopped": quiescence, senescence, dormancy',e:'Vocabulary',b:`<ul><li><b>Quiescence</b>: a pause. The cell can restart when conditions improve.</li><li><b>Senescence</b>: a stable stop. The cell looks half dead but is alive and keeps sending signals, the <b>SASP</b> (senescence-associated secretory phenotype).</li><li><b>Dormancy</b>: mostly used for cancer cells that spread and stay silent for months or years until something wakes them {{6}}.</li></ul><div class="note"><div class="h">Why it matters</div><p>The borders between these three are blurry, so the thesis does not treat them as boxes. See the next row.</p></div>`},
{id:'c3',t:'One line, not three boxes: arrest depth',e:'Core idea',b:`<p>Think of a dimmer switch, not an on/off switch. At one end a light pause that is easy to reverse, then deeper quiescence, and at the far end senescence, which is very hard to undo {{7,8}}.</p><p>Where a cell sits on this line is its <b>arrest depth</b>. Dormant cancer cells mostly sit in the quiescent part, which is why they can wake up again.</p><p>Try the slider on the <b>Start</b> tab.</p>`},
{id:'c4',t:'How do you measure depth? Not with SA-β-gal alone',e:'Markers',b:`<p><b>SA-β-gal</b> is the usual blue stain for "senescent". But it mostly shows how <i>long</i> a cell has been stopped, not how <i>deeply</i>. It separated deep from light arrest only slightly better than chance (<b>AUC 0.55</b>), while <b>p21</b> (up) and <b>lamin B1</b> (down) did better (<b>AUC 0.75-0.76</b>) {{8}}.</p><p>That is why the thesis scores every sample on several gene sets instead of trusting one stain.</p><div class="note"><div class="h">AUC in one line</div><p>0.5 = coin flip, 1.0 = perfect at telling two groups apart.</p></div>`},
{id:'c5',t:'The acid study: pseudosenescence at pH 6.7',e:'Dataset 1',b:`<p>MEL-JUSO melanoma cells were kept at pH 6.7 for over two months. About half stain for SA-β-gal, and p21 and p53 go up, so they look senescent. But moved back to pH 7.4, the stop starts to reverse within about <b>96 hours</b>, so the authors call it <b>pseudosenescence</b> {{1,20}}.</p><p>Thesis reading: these cells are stopped, but probably not as deeply as truly senescent cells.</p>`},
{id:'c6',t:'The gel study: a stiff gel also stops them',e:'Dataset 2',b:`<p>Mel Im melanoma cells were grown in a stiff, confining gel (<b>Cellink</b>) or a soft one (<b>Matrigel</b>). In Cellink they stop dividing within days. RNA was taken after two days {{2}}.</p>`},
{id:'c7',t:'The puzzle: same destination, different roads',e:'Why this thesis',b:`<p>Acid and a stiff gel have nothing in common, yet in both studies the stopped cells map to the mesenchymal cluster of the Pozniak atlas. Two explanations:</p><ul><li><b>A shared program</b>: both stresses switch on the same genes.</li><li><b>Depth</b>: the mesenchymal look is something general about stopped cells, linked to how deeply they stopped.</li></ul><p>Or a mix of both.</p>`},
{id:'c8',t:'Why a shared gene list is not enough',e:'The problem',b:`<p>Stopped cells share many gene changes whatever stopped them: cell cycle genes go down, p21 goes up {{11}}. So an overlap between acid and gel could just mean "both are stopped".</p><p>Also, both source papers already compared against the Pozniak cluster, so repeating that would add little. The new piece is to <b>measure depth first</b>, take its effect out, and only then compare.</p>`}
],
data:[
{id:'d1',t:'What RNA-seq data looks like',e:'Basics',b:`<p>RNA-seq counts, for each gene, how many reads came from it. The result is a <b>count table</b>: one row per gene (about 12,000+ expressed), one column per <b>sample</b>. A sample is one RNA library. A <b>replicate</b> is an independent repeat of the same condition.</p><p>Both datasets are <b>bulk</b> RNA-seq: each sample is the average of many cells.</p>`},
{id:'d2',t:'Dataset 1: acid (MEL-JUSO)',e:'12 samples',b:`<p>Cells at pH 6.7 for over two months, pH 7.4 as control, sorted by SA-β-gal into the top and bottom 2%. That gives four groups: <span class="tag a">control-low</span><span class="tag a">control-high</span><span class="tag a">acid-low</span><span class="tag a">acid-high</span>, three replicates each, about 40 million reads per sample {{1}}.</p><p><b>Control-high</b> is the most useful group: high SA-β-gal at normal pH, so it seems to be stopped without acid. A built-in control for "stopped on its own". This is inferred from the stain, not measured directly.</p><p>Raw reads are public: NCBI BioProject <b>PRJNA1200919</b>, with unsorted whole-population libraries too.</p>`},
{id:'d3',t:'Dataset 2: gel (Mel Im)',e:'about 6 samples',b:`<p>Two groups: Cellink (stiff) vs Matrigel (soft), no SA-β-gal split, RNA after two days {{2}}. Expected: three replicates per group, about 20 million reads each.</p><div class="note"><div class="h">Still open</div><p>The replicate count is not confirmed and no public accession was found. The data has to come from Dr. Fischer.</p></div>`},
{id:'d4',t:'How both were processed',e:'Pipeline',b:`<p>Reads aligned to the human genome <b>GRCh38</b> with <b>STAR</b>, counted per gene with <b>featureCounts</b>, analysed with <b>DESeq2</b> {{9}}.</p><p>The two datasets are <b>never merged or batch-corrected together</b>: they differ in cell line and sequencing. Each is compared with its own control.</p>`},
{id:'d5',t:'To confirm with Dr. Fischer before starting',e:'Checklist',b:`<ul><li>Are all four sorted acid groups, and any unsorted libraries, available?</li><li>How many gel replicates are there?</li><li>Can both datasets be shared as count tables?</li><li>Where do the gel reads come from (no public accession)?</li></ul>`}
],
method:[
{id:'m1',t:'Step 1. Prepare each dataset on its own',e:'QC',b:`<p>Start from count tables, check library sizes, make a <b>PCA</b> plot to see whether replicates cluster. Everything runs in R with free Bioconductor packages on a normal laptop.</p><span class="lab">Tool</span><p>R, DESeq2 {{9}}</p>`},
{id:'m2',t:'Step 2. Give every sample a depth score',e:'Aim 1',b:`<p>With <b>singscore</b> {{12}} score each sample on published gene sets: proliferation (Hallmark E2F and G2/M targets), a quiescence depth set {{7}} and senescence sets such as SenMayo {{13,14}}. At its core, deeper = p21 (<i>CDKN1A</i>) up, lamin B1 (<i>LMNB1</i>) down {{8}}.</p><div class="note"><div class="h">Check first</div><p>The gene sets come from non-melanoma cells, so first check that the score puts control-high above control-low.</p></div>`},
{id:'m3',t:'Step 3. Learn what depth does to each gene',e:'Aim 2',b:`<p>In the acid controls, control-high is deeper than control-low. The DESeq2 fold change between them, divided by their difference in depth score, gives how much each gene changes <b>per unit of depth</b>.</p>`},
{id:'m4',t:'Step 4. Take the leftover',e:'Aim 2',b:`<p>For each stress comparison (acid-high vs control-high, and Cellink vs Matrigel): multiply change-per-depth by that comparison's depth difference = the change <b>expected from depth alone</b>.</p><p><b>Leftover = observed fold change − expected change.</b></p><p>The two cell lines are never compared directly. Genes used in the depth score are left out of the later comparison.</p>`},
{id:'m5',t:'Step 5. Compare the leftovers',e:'Aim 2',b:`<p>Shrink fold changes first (<b>apeglm</b> {{17}}), rank genes by leftover, and compare acid and gel rankings with <b>RRHO2</b> {{15}} and preranked <b>GSEA</b> {{16}}. Do the same before removing depth, to see how much overlap depth takes away.</p>`},
{id:'m6',t:'Step 6. Use the acid 2 × 2 design',e:'Model',b:`<p>Two factors, pH and sorting. Fit <span class="mono">~ pH + sorting + pH:sorting</span>. The interaction asks whether acid changes what being stopped does. With three replicates only large effects will show.</p>`},
{id:'m7',t:'Step 7. Find the regulators',e:'Aim 3',b:`<p>With <b>decoupleR</b> {{18}} and the <b>CollecTRI</b> target list {{19}}, infer the activity of <b>TCF4</b> {{5}}, <b>AP-1</b> {{2}}, <b>ATF4</b> {{20}} and <b>NR2F1</b> {{21,22}} from their target genes, before and after removing depth. A regulator active in both datasets after depth removal is stronger evidence than a shared gene list.</p><div class="note"><div class="h">Check first</div><p>That CollecTRI has enough targets for each of them.</p></div>`},
{id:'m8',t:'Step 8. Fix the rules before the main test',e:'Safeguard',b:`<p><b>Linearity check</b>: the depth pattern from the controls should appear in each stress comparison about as strongly as its depth gap predicts (after correcting for noise). If it is outside <b>0.8 to 1.25 times</b>, depth cannot be removed cleanly, and that is reported instead of claiming a program.</p><p>If it passes: simulate data where depth explains everything, using real DESeq2 noise levels, and run the same steps. Shared noise alone can make leftovers look alike. A shared program counts only if the real overlap is clearly larger than in the simulations and holds when one replicate is left out. The cut-off between "mix" and "program" is agreed with Dr. Fischer beforehand.</p>`},
{id:'m9',t:'Step 9. Stress-test the answer',e:'Robustness',b:`<p>Repeat with a simpler depth score (only p21 and lamin B1) and leave each replicate out in turn. Anything that changes is reported as <b>fragile</b>.</p>`}
],
answer:[
{id:'a1',t:'Outcome A: depth explains it (H0)',e:'Depth only',b:`<p>After removing depth, the acid and gel leftovers no longer overlap more than expected, and the mesenchymal score follows depth.</p><p><b>Meaning:</b> TCF4 would be a sign of how deeply cells stopped, not a stress program.</p>`},
{id:'a2',t:'Outcome B: depth explains part (H2)',e:'A mix',b:`<p>The overlap drops after removing depth but some stays, still larger than expected from depth alone.</p><p><b>Meaning:</b> genes and regulators in the remaining part become candidates for a shared program.</p>`},
{id:'a3',t:'Outcome C: depth explains little (H1)',e:'Shared program',b:`<p>The overlap stays almost the same, and mesenchymal and TCF4-target genes are still among the shared genes.</p><p><b>Meaning:</b> both stresses switch on a program of their own. Its regulators become a shortlist for future knockdown experiments.</p>`},
{id:'a4',t:'Why this matters beyond two datasets',e:'Impact',b:`<p>The mesenchymal state is linked to drug tolerance and weaker immunotherapy response {{5,22}}. A recent melanoma study merged slow-cycling and mesenchymal traits into one dormancy score {{23}}. This thesis asks whether those two traits should be kept apart.</p>`},
{id:'a5',t:'Timeline (six months) and deliverables',e:'Plan',b:`<ul><li><b>Month 1</b> data access, quality checks, pipeline set-up</li><li><b>Month 2</b> depth score</li><li><b>Month 3</b> depth line and leftovers</li><li><b>Month 4</b> acid-gel comparison, 2 × 2 model, regulators</li><li><b>Month 5</b> robustness checks, results frozen, writing starts</li><li><b>Month 6</b> writing and submission</li></ul><p>Extra robustness checks are cut first if time runs short. Deliverables: depth scores, leftover tables, comparison figures, a documented GitHub pipeline, and the thesis. Real dates depend on registration.</p>`},
{id:'a6',t:'How the question changed from the first plan',e:'History',b:`<div class="tscroll" style="margin:6px 0 0"><table class="mini" style="min-width:420px"><tr><th></th><th>Earlier plan</th><th>This proposal</th></tr><tr><td>Question</td><td>Do both stopped states share a program?</td><td>Depth, a program, or a mix?</td></tr><tr><td>Compared</td><td>Gene lists</td><td>Leftovers after depth removal</td></tr><tr><td>SA-β-gal</td><td>Taken as "stopped"</td><td>One weak signal among many</td></tr><tr><td>Overlap found</td><td>"Shared program"</td><td>Program only if it survives depth removal</td></tr><tr><td>No overlap</td><td>"No shared program"</td><td>Could be different depths</td></tr></table></div>`}
],
limits:[
{id:'l1',t:'Only three replicates per group',e:'Biggest limit',b:`<p>Only large effects are reliable, and a non-significant result does not mean there is no effect. Safeguards: score every sample, compare whole rankings, leave one replicate out at a time.</p>`},
{id:'l2',t:'The depth line rests on two control groups',e:'Range',b:`<p>The most deeply stopped acid samples may lie outside the range the line was learned from. The linearity check (Step 8) is there to catch this.</p>`},
{id:'l3',t:'The gel line is borrowed from a different cell line',e:'Weaker half',b:`<p>Depth is learned in MEL-JUSO but applied to Mel Im. That makes the gel result the weaker half of the comparison.</p>`},
{id:'l4',t:'Acid lowers protein synthesis',e:'Confound',b:`<p>Acid reduces protein synthesis through ATF4 {{20}}, so translation genes stay out of the main depth score.</p>`},
{id:'l5',t:'Sorted 2% slice and bulk averaging',e:'Resolution',b:`<p>The acid cells are a sorted 2% slice, and bulk RNA-seq averages all cells in a sample. Single-cell data would be the natural next step.</p>`},
{id:'l6',t:'The method might fail, and that is allowed',e:'Honesty',b:`<p>If the linearity check fails, the thesis reports that depth could not be separated cleanly. That is a limit of the method, not a finding about biology.</p>`},
{id:'l7',t:'The approach is my own proposal',e:'Novelty',b:`<p>As far as the proposal knows, this exact approach has not been tried on these datasets. Keep that claim modest, and double check the literature before the thesis states it.</p>`}
]
};

const TERMS=[
{id:'t1',g:'stats',t:'log2 fold change (log2FC)',q:'What does +3.24 mean?',b:`<p><b>log2FC = log2(B / A)</b>: how much a gene goes up or down in B compared with A, on a doubling scale.</p><ul><li><b>0</b> = no change</li><li><b>+1</b> = 2× up, <b>+2</b> = 4× up</li><li><b>−1</b> = half, <b>−2</b> = a quarter</li><li><b>+3.24</b> = 2<sup>3.24</sup> ≈ <b>9.45×</b> up</li></ul><p>Logs make up and down symmetric. Use the calculator below.</p>`},
{id:'t2',g:'stats',t:'p-value',q:'What does p = 0.01 say?',b:`<p>If there were <b>really no difference</b>, the chance of seeing a difference at least this big by luck. Small p = hard to explain by chance.</p><p>It is <b>not</b> the probability that the gene is unchanged, and it says nothing about how big or important the change is.</p>`},
{id:'t3',g:'stats',t:'Adjusted p-value (padj)',q:'Why not just use p < 0.05?',b:`<p>You test about 12,000 genes at once. At p < 0.05, about 5% of them, around <b>600 genes</b>, would pass by luck alone. <b>padj</b> corrects for this, in DESeq2 with Benjamini-Hochberg: it controls the <b>false discovery rate</b>.</p><p><b>padj < 0.05</b> means about 5% of the genes you call significant are expected to be false alarms.</p>`},
{id:'t4',g:'stats',t:'DEG (differentially expressed gene)',q:'What makes a gene a DEG?',b:`<p>A gene whose expression differs between two conditions by your chosen thresholds, typically <b>padj < 0.05</b> and |log2FC| above a cut (often 1). The thresholds are a choice, so always report them.</p><p>This thesis compares <b>whole rankings</b> rather than DEG lists, to avoid the arbitrary cut.</p>`},
{id:'t5',g:'stats',t:'Pearson vs Spearman correlation',q:'Which one for ranked gene lists?',b:`<ul><li><b>Pearson</b>: straight-line relationship between the actual values. Sensitive to outliers.</li><li><b>Spearman</b>: Pearson on the <b>ranks</b>. Catches any consistently rising or falling relationship, robust to outliers and skewed data.</li></ul><p>Fold changes are skewed with outliers, and the thesis ranks genes, so Spearman fits.</p>`},
{id:'t6',g:'bio',t:'Gene regulation: eukaryotes vs prokaryotes',q:'Name three differences.',b:`<ul><li><b>Prokaryotes</b>: no nucleus, transcription and translation happen together. Genes grouped in <b>operons</b> (one mRNA, several proteins). Control mainly by sigma factors, repressors and activators at the promoter.</li><li><b>Eukaryotes</b>: nucleus separates the steps. DNA wrapped in <b>chromatin</b>, so histone marks and DNA methylation matter. Distant <b>enhancers</b>, many transcription factors acting together, mRNA <b>processing</b> (cap, splicing, poly-A), microRNAs, regulated protein stability.</li></ul><p>Eukaryotes simply have more places to regulate, which is why TF activity like TCF4 matters in this thesis.</p>`},
{id:'t7',g:'bio',t:'Biological levels',q:'Which level does RNA-seq see?',b:`<p>Genome → epigenome → <b>transcriptome</b> → proteome → metabolome → phenotype. Bulk RNA-seq sees only the transcriptome (mRNA levels), averaged over many cells. mRNA does not always predict protein, so conclusions stay at the level of gene expression.</p>`},
{id:'t8',g:'stats',t:'Analysis steps: sample A vs sample B',q:'List the steps from reads to result.',b:`<ol style="margin:0 0 9px;padding-left:18px"><li>Quality check of reads</li><li>Align to genome (STAR), count per gene (featureCounts)</li><li>Count table, filter low genes</li><li>Normalise for library size</li><li>PCA, check replicates cluster</li><li>Fit model and test (DESeq2): log2FC, p, padj</li><li>Shrink noisy fold changes (apeglm)</li><li>Call DEGs or rank genes</li><li>Interpret: gene sets, pathways, regulators</li></ol>`},
{id:'t9',g:'tool',t:'R code behind it (DESeq2)',q:'What do these lines do?',b:`<p>The core of a two-condition comparison:</p><pre class="code">dds &lt;- DESeqDataSetFromMatrix(
  countData = counts,      # genes x samples
  colData   = coldata,     # one row per sample
  design    = ~ condition)
dds &lt;- DESeq(dds)           # normalise, fit, test
res &lt;- results(dds, contrast = c("condition","B","A"))
resLFC &lt;- lfcShrink(dds, coef = "condition_B_vs_A",
                    type = "apeglm")   # shrunken log2FC</pre><p>The thesis design adds more terms: <span class="mono">~ pH + sorting + pH:sorting</span>.</p>`},
{id:'t10',g:'tool',t:'DESeq2',q:'What goes in, what comes out?',b:`<p>Takes <b>raw counts</b> (not normalised), models them with a negative binomial distribution, and returns per gene a log2FC, p-value and padj {{9}}.</p>`},
{id:'t11',g:'tool',t:'apeglm shrinkage',q:'Why shrink?',b:`<p>Genes with few reads have wildly unstable fold changes. Shrinkage pulls those toward zero and leaves well-measured large changes alone {{17}}. Done before the leftover is calculated.</p>`},
{id:'t12',g:'tool',t:'PCA',q:'What should replicates do?',b:`<p>Squashes thousands of genes into two or three axes so you can see samples as dots. Replicates of the same condition should sit together.</p>`},
{id:'t13',g:'tool',t:'singscore',q:'What does it give a sample?',b:`<p>A score for one sample on one gene set: how high do those genes rank within that sample? It needs no cohort, so each sample is scored alone {{12}}.</p>`},
{id:'t14',g:'tool',t:'RRHO2',q:'What does it compare?',b:`<p>Two ranked gene lists (acid leftovers vs gel leftovers). Shows where the same genes agree (both up, both down) or disagree {{15}}.</p>`},
{id:'t15',g:'tool',t:'Preranked GSEA',q:'What question does it answer?',b:`<p>Given a ranked list, are the genes of a set (say, mesenchymal) bunched near the top or bottom more than chance {{16}}?</p>`},
{id:'t16',g:'tool',t:'decoupleR and CollecTRI',q:'How do you know a TF is active?',b:`<p>A TF itself is rarely measured well. Instead, look at whether its known targets (from CollecTRI {{19}}) go up or down together, and call the TF active or inactive {{18}}.</p>`},
{id:'t17',g:'bio',t:'p21 (CDKN1A) and lamin B1 (LMNB1)',q:'Which way does each move with depth?',b:`<p><b>p21</b> blocks the cell cycle: it rises as arrest deepens. <b>Lamin B1</b>, a nuclear lamina protein, falls {{8}}.</p>`},
{id:'t18',g:'bio',t:'SA-β-gal',q:'What does it really tell you?',b:`<p>A stain for lysosomal activity that is often used as the senescence marker. Better at telling how long cells have been stopped than how deeply {{8}}.</p>`},
{id:'t19',g:'bio',t:'SASP',q:'What does the S stand for?',b:`<p>Senescence-associated secretory phenotype: the cocktail of signals senescent cells release.</p>`},
{id:'t20',g:'bio',t:'MITF-high vs mesenchymal TCF4-high',q:'Which one divides fast?',b:`<p>Two ends of melanoma plasticity. <b>MITF-high</b>: pigment-like, proliferative. <b>Mesenchymal, TCF4-high</b>: slower, invasive, linked to immunotherapy resistance {{3,5}}.</p>`},
{id:'t21',g:'bio',t:'Pseudosenescence',q:'What separates it from senescence?',b:`<p>Looks senescent (SA-β-gal, p21, p53 up) but reverses when the stress goes away. In the acid study, within about 96 hours at pH 7.4 {{1}}.</p>`},
{id:'t22',g:'tool',t:'Leftover, expected change, linearity check',q:'Write the leftover as a formula.',b:`<p><b>Leftover = observed − (change per depth × depth gap).</b> The linearity check asks whether depth really acts in a straight line; the ratio should fall between 0.8 and 1.25.</p>`}
];

const bgUrl=()=>{const v=ls.get(KBG);return v==='none'?'':(v||DEFAULT_BG)};
let st={done:{},mascot:true,dim:70,fit:'cover'};
let mem={};
const ls={get(k){try{const v=localStorage.getItem(k);return v===null?(mem[k]??null):v}catch(e){return mem[k]??null}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}};
try{const j=JSON.parse(ls.get(KEY)||'null');if(j&&typeof j==='object'){st.done=j.done||{};st.mascot=j.mascot!==false;st.dim=typeof j.dim==='number'?j.dim:70;st.fit=j.fit==='contain'?'contain':'cover'}}catch(e){}
const save=()=>ls.set(KEY,JSON.stringify(st));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cite=h=>h.replace(/\{\{([\d,\s]+)\}\}/g,(_,l)=>'<span class="mono">['+l.split(',').map(n=>'<a class="cite" data-ref="'+n.trim()+'" role="link" tabindex="0">'+n.trim()+'</a>').join(',')+']</span>');
const toast=(m)=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)};
const accent=id=>(SECT.find(s=>s.id===id)||{}).c;

/* progress */
function ids(sec){
  if(sec==='papers')return PAPERS.map(p=>'p'+p.n);
  if(sec==='terms')return TERMS.map(t=>t.id);
  return (ROWS[sec]||[]).map(r=>r.id);
}
function prog(sec){const a=ids(sec);const d=a.filter(i=>st.done[i]).length;return{d,n:a.length}}
function overall(){let d=0,n=0;['cells','data','method','answer','limits','papers','terms'].forEach(s=>{const p=prog(s);d+=p.d;n+=p.n});return{d,n,pct:n?Math.round(100*d/n):0}}
function setHead(){$('#hpct').textContent=overall().pct+'%'}

/* rows */
function rowHTML(r,sec,opts={}){
  const on=!!st.done[opts.key||r.id];
  return '<div class="row" data-id="'+(opts.key||r.id)+'"><div class="rowhead" role="button" tabindex="0" aria-expanded="false"><span class="idx">'+esc(opts.idx||'')+'</span><span class="ttl">'+esc(r.t)+(r.e?'<em>'+esc(r.e)+'</em>':'')+'</span><button class="tick'+(on?' on':'')+'" aria-label="Mark as learned" aria-pressed="'+on+'">✓</button><span class="caret"></span></div><div class="rowbody">'+cite(r.b)+'</div></div>';
}
function rowsHTML(sec){return '<div class="rows">'+ROWS[sec].map((r,i)=>rowHTML(r,sec,{idx:String(i+1).padStart(2,'0')})).join('')+'</div>'}
function shead(sec,k,title,sub){return '<div class="shead"><div class="k">'+k+'</div><h1>'+title+'</h1><p class="sub" style="margin-top:6px">'+sub+'</p></div>'}
function sectionTop(sec){const p=prog(sec);return '<div class="card" style="padding:10px 14px"><div class="chead" style="margin:0 0 8px"><span class="dot"></span><span class="k">Learned</span><span class="r">'+p.d+' / '+p.n+'</span></div><div class="strip" data-strip="'+sec+'">'+strip(sec)+'</div></div>'}
function strip(sec){return ids(sec).map(i=>'<i class="'+(st.done[i]?'done':'')+'"></i>').join('')}
function setAcc(el,sec){el.style.setProperty('--accent',accent(sec))}

/* views */
const V={};
V.cells=()=>shead('cells','Section 1','The cells and the idea','Everything you need before the numbers: what is stopping, what is depth, and what the two datasets are about.')+sectionTop('cells')+rowsHTML('cells');

 '<div class="tscroll"><table><tr><th></th><th>Acid</th><th>Gel</th></tr><tr><td>Cells</td><td>MEL-JUSO</td><td>Mel Im</td></tr><tr><td>Stress</td><td>pH 6.7 for 2+ months (control pH 7.4)</td><td>Stiff Cellink vs soft Matrigel</td></tr><tr><td>Sorting</td><td>SA-β-gal top and bottom 2%</td><td>None</td></tr><tr><td>Groups</td><td>4 (ctrl-low, ctrl-high, acid-low, acid-high)</td><td>2</td></tr><tr><td>Samples</td><td>12 (3 per group), about 40 M reads</td><td>about 6, about 20 M reads (to confirm)</td></tr><tr><td>Time</td><td>Months</td><td>2 days</td></tr><tr><td>Source</td><td>PRJNA1200919 (public)</td><td>No accession, from Dr. Fischer</td></tr></table></div>'+
 rowsHTML('data')+

 '<div class="card"><div class="chead"><span class="dot"></span><span class="k">The idea in one line</span></div><div class="flow"><div><b>Controls</b>Learn what depth does to each gene</div><div><b>Stressed</b>Subtract the expected depth effect</div><div><b>Leftover</b>Acid vs gel, compared</div><div><b>Verdict</b>Depth, program or mix</div></div><p class="sub" style="margin:0">If depth explained everything, a stressed sample would just be a control that stopped more deeply.</p></div>'+
 rowsHTML('method')+
 '<div class="card"><div class="chead"><span class="dot"></span><span class="k">Toy: how much does depth explain?</span><span class="r">illustrative</span></div><p class="sub">Move the slider: the share of the acid-gel overlap that depth explains. Cut-offs here are made up; the real ones are agreed with Dr. Fischer.</p><input type="range" id="toy" min="0" max="100" value="60" aria-label="Share explained by depth"><div class="barrow"><span class="n">Before</span><div class="bar"><i style="width:100%;--accent:var(--faint)"></i></div><span class="v">100</span></div><div class="barrow"><span class="n">After</span><div class="bar" style="position:relative"><i id="toyA" style="width:40%"></i><u style="position:absolute;left:10%;top:-3px;bottom:-3px;width:2px;background:var(--tx);opacity:.6"></u></div><span class="v" id="toyV">40</span></div><p class="tiny" style="margin:-2px 0 8px">White tick = overlap expected from depth alone (simulations).</p><div class="note"><div class="h" id="toyH">Outcome</div><p id="toyT"></p></div></div>';
V.answer=()=>shead('answer','Section 4','What could come out','Three possible results, and each one answers the question.')+sectionTop('answer')+
 '<div class="card"><div class="chead"><span class="dot"></span><span class="k">The question</span></div><div class="display">Is it depth, is it a program, or is it a mix of both?</div></div>'+
 '<div class="tscroll"><table><tr><th>Hypothesis</th><th>After removing depth</th><th>Outcome</th></tr><tr><td>H0 depth only</td><td>No more overlap than depth alone explains; mesenchymal score follows depth</td><td>A: TCF4 is a sign of depth</td></tr><tr><td>H2 mix</td><td>Overlap smaller, still above depth alone</td><td>B: remaining genes are program candidates</td></tr><tr><td>H1 program</td><td>Overlap almost unchanged; mesenchymal and TCF4 targets stay</td><td>C: shortlist for knockdown experiments</td></tr></table></div>'+
 rowsHTML('answer');
V.limits=()=>shead('limits','Section 5','Limits and safeguards','Know the weak points before anyone asks.')+sectionTop('limits')+rowsHTML('limits')+
 '<div class="card"><div class="chead"><span class="dot"></span><span class="k">Questions to ask Dr. Fischer</span></div><ul style="margin:0;padding-left:18px;font-size:14px"><li>Are all four sorted acid groups and any unsorted libraries available?</li><li>How many replicates does the gel dataset have, and where does it come from?</li><li>Can both be shared as count tables?</li><li>What cut-off separates "mix" from "program"?</li><li>Registration date, so the six-month timeline gets real dates?</li></ul></div>';

let pf={f:'all',q:''};
V.papers=()=>shead('papers','Section 6','The papers','Twenty-three references. Start with the six marked Read first.')+sectionTop('papers')+
 '<div class="chips" id="pchips">'+[['all','All'],['core','Read first (6)'],['method','Methods'],['bg','Background'],['todo','Not read']].map(c=>'<button class="chip'+(pf.f===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>').join('')+'</div><div class="search"><input type="search" id="psearch" placeholder="Search title or author" value="'+esc(pf.q)+'"></div><div id="plist"></div>';
function plist(){
  const q=pf.q.toLowerCase();
  const a=PAPERS.filter(p=>{const n=NOTES[p.n];if(pf.f==='core'&&n[0]!=='core')return false;if(pf.f==='method'&&n[0]!=='method')return false;if(pf.f==='bg'&&n[0]!=='bg')return false;if(pf.f==='todo'&&st.done['p'+p.n])return false;
    return !q||(p.t+' '+p.au+' '+p.y+' '+p.j).toLowerCase().includes(q)});
  $('#plist').innerHTML=a.length?'<div class="rows">'+a.map(p=>{const n=NOTES[p.n];
    return rowHTML({t:p.t,e:p.au+' '+p.y+' · '+p.j,b:'<p>'+esc(n[1])+'</p><p><span class="tag '+(n[0]==='core'?'ok':n[0]==='method'?'chk':'')+'">'+({core:'Read first',method:'Method',bg:'Background'})[n[0]]+'</span><span class="tag">Used in: '+esc(n[2])+'</span></p><a class="doi" href="https://doi.org/'+p.doi+'" target="_blank" rel="noopener">doi.org/'+esc(p.doi)+' ↗</a>'},'papers',{key:'p'+p.n,idx:'['+p.n+']'})}).join('')+'</div>':'<div class="empty">No paper matches.</div>';
  $$('#plist .row').forEach(r=>setAcc(r,'papers'));
}
let tf={f:'all',q:''};
V.terms=()=>shead('terms','Section 7','Terms and statistics','The theory topics, in plain words. Open a term, answer the question in your head, then read.')+sectionTop('terms')+
 '<div class="card"><div class="chead"><span class="dot"></span><span class="k">Calculator: log2 fold change</span></div><div class="calc"><label class="tiny" for="lfc">log2FC</label><input type="text" id="lfc" inputmode="decimal" value="3.24"><span id="lfcOut" class="mono"></span></div></div>'+
 '<div class="card"><div class="chead"><span class="dot"></span><span class="k">Calculator: why padj</span></div><div class="calc"><label class="tiny" for="gn">genes</label><input type="text" id="gn" inputmode="numeric" value="12000"><label class="tiny" for="al">cut-off</label><input type="text" id="al" inputmode="decimal" value="0.05"></div><p id="fpOut" class="sub" style="margin:8px 0 0"></p></div>'+
 '<div class="chips" id="tchips">'+[['all','All'],['stats','Statistics'],['bio','Biology'],['tool','Tools']].map(c=>'<button class="chip'+(tf.f===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>').join('')+'</div><div class="search"><input type="search" id="tsearch" placeholder="Search terms" value="'+esc(tf.q)+'"></div><div id="tlist"></div>';
function tlist(){
  const q=tf.q.toLowerCase();
  const a=TERMS.filter(t=>(tf.f==='all'||t.g===tf.f)&&(!q||(t.t+' '+t.b.replace(/<[^>]+>/g,' ')).toLowerCase().includes(q)));
  $('#tlist').innerHTML=a.length?'<div class="rows">'+a.map((t,i)=>rowHTML({t:t.t,e:'Ask yourself: '+t.q,b:t.b},'terms',{key:t.id,idx:String(i+1).padStart(2,'0')})).join('')+'</div>':'<div class="empty">No term matches.</div>';
  $$('#tlist .row').forEach(r=>setAcc(r,'terms'));
}
function calcs(){
  const f=parseFloat(String($('#lfc').value).replace(',','.'));
  $('#lfcOut').textContent=isFinite(f)?'= '+(f>=0?Math.pow(2,f):1/Math.pow(2,-f)).toFixed(2)+'× '+(f>0?'up':f<0?'down':'(no change)'):'enter a number';
  const g=parseFloat($('#gn').value), a=parseFloat(String($('#al').value).replace(',','.'));
  $('#fpOut').innerHTML=isFinite(g)&&isFinite(a)?'Testing <b>'+Math.round(g).toLocaleString('en')+'</b> genes at p &lt; '+a+' with no real differences still gives about <b>'+Math.round(g*a).toLocaleString('en')+'</b> false hits. That is what the adjusted p-value controls.':'enter numbers';
}

/* start */
const DEPTH=[
[14,'Cycling','Dividing normally. Nothing to reverse.','Reversible at once'],
[39,'Light quiescence','A short pause. Wakes up fast when conditions improve.','Easy to reverse'],
[64,'Deep quiescence','Paused for longer. Takes more to restart. Dormant cancer cells mostly live in this region.','Reversible, slower'],
[84,'Early senescence','The stop is hardening. Restarting gets unlikely.','Hard to reverse'],
[100,'Senescence','A stable stop. Cell stays alive and sends out SASP signals.','Very hard to undo']
];
function ringSVG(p,c){const r=17,L=2*Math.PI*r;return '<svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="'+r+'" fill="none" stroke="var(--panel3)" stroke-width="4"/><circle cx="22" cy="22" r="'+r+'" fill="none" stroke="'+c+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+(L*p/100).toFixed(1)+' '+L.toFixed(1)+'" transform="rotate(-90 22 22)"/></svg>'}
V.start=()=>{
  const o=overall();
  const rings=['cells','data','method','answer','limits','papers','terms'].map(s=>{const p=prog(s),pc=p.n?Math.round(100*p.d/p.n):0,a=accent(s);return '<a class="ringbox" href="#'+s+'" style="border-bottom:1px solid var(--line)">'+ringSVG(pc,a)+'<div class="v" style="color:'+a+'">'+pc+'%</div><div class="l">'+s+'</div></a>'}).join('')+'<div class="ringbox" style="cursor:default">'+ringSVG(o.pct,'var(--tx)')+'<div class="v">'+o.pct+'%</div><div class="l">all</div></div>';
  return '<div class="heroimg"><div class="hi-art" id="hiart"></div><div class="hi-title"><div class="eyebrow">Master\'s thesis · melanoma</div><div class="hi-name">Arrest Depth Atlas</div></div><div class="hi-cue">Scroll<i></i></div></div><div class="card hero" style="--accent:var(--c-cells)"><div class="eyebrow" style="margin-bottom:10px">Master\'s thesis · R. Alqazi · DIT Life Science Informatics</div><div class="display">Is the mesenchymal state of stopped melanoma cells a matter of depth, or of a shared program?</div><p class="sub" style="margin:12px 0 0">Two very different stresses, acid and a stiff gel, make melanoma cells stop dividing and turn mesenchymal. This thesis asks whether that look only reflects <b style="color:var(--tx)">how deeply</b> the cells have stopped, or whether both stresses switch on the <b style="color:var(--tx)">same program</b>. Purely computational, on two existing RNA-seq datasets.</p></div>'+
  '<div class="card" style="--accent:var(--c-start)"><div class="chead"><span class="dot"></span><span class="k">Five-minute route for a newcomer</span></div><div class="lines">'+
  [['cells','1 · What is being stopped, and what is depth','Cells'],['data','2 · Which two datasets','Data'],['method','3 · The nine steps','Method'],['answer','4 · What could come out','Answer'],['terms','5 · The statistics words','Terms']].map(x=>'<a class="lnk" href="#'+x[0]+'" style="--accent:'+accent(x[0])+'"><div><b>'+x[1]+'</b><span>'+x[2]+' tab</span></div><span class="ar">→</span></a>').join('')+'</div></div>'+
  '<div class="card" style="--accent:var(--c-answer)"><div class="chead"><span class="dot"></span><span class="k">The depth line</span><span class="r">illustrative</span></div><p class="sub" style="margin-bottom:0">Drag to see how arrest deepens.</p><div class="depthbar"><div class="pin" id="pin" style="left:30%"></div></div><div class="depthlab"><span>Light pause</span><span>Quiescence</span><span>Senescence</span></div><input type="range" id="dslide" min="0" max="100" value="30" aria-label="Arrest depth"><div id="dout"></div></div>'+
  '<div class="card" style="--accent:var(--c-start)"><div class="chead"><span class="dot"></span><span class="k">Progress</span><span class="r">'+o.d+' / '+o.n+'</span></div><div class="rings eight" style="margin:0">'+rings+'</div></div>'+
  '<div class="card" style="--accent:var(--c-terms)"><div class="chead"><span class="dot"></span><span class="k">Look and backup</span></div>'+
  '<span class="lab" style="margin-top:0">Wallpaper</span><p class="tiny" style="margin:0 0 8px">Your picture sits behind the app. Choose another one any time. Without a picture, Sable, an original figure, stands there instead.</p><div class="btnrow"><button id="bgpick">Choose image</button><button class="gh" id="bgclear">Remove</button><button class="gh" id="bgfit">'+(st.fit==='contain'?'Fill screen':'Show whole picture')+'</button></div><input type="file" id="bgfile" accept="image/*" hidden>'+
  '<div style="display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:10px"><label class="tiny" for="dim">Wallpaper strength</label><span class="mono tiny" id="dimv">'+st.dim+'</span></div><input type="range" id="dim" min="20" max="100" value="'+st.dim+'" aria-label="Wallpaper strength">'+
  '<div class="btnrow" style="margin-top:6px"><button class="gh" id="mascot">'+(st.mascot?'Hide Sable':'Show Sable')+'</button></div>'+
  '<span class="lab">Backup of your ticks</span><textarea id="bk" spellcheck="false" placeholder="Press Make backup, copy the text, keep it somewhere safe. To restore, paste it here and press Restore."></textarea><div class="btnrow" style="margin-top:8px"><button id="bkmake">Make backup</button><button id="bkcopy" class="gh">Copy</button><button id="bkrest" class="gh">Restore</button><button id="reset" class="gh">Reset ticks</button></div></div>'+
  '<p class="tiny" style="padding:4px 2px 12px">Content lives in one block of the page code (NOTES, ROWS, TERMS, PLACES), so it can be updated when the thesis changes. Based on the proposal of November 2026.</p>';
};
function heroPaint(){
  const el=$('#hiart');if(!el)return;const u=bgUrl();
  if(u){el.style.backgroundImage='url("'+u+'")';el.style.backgroundSize=st.fit;el.style.backgroundPosition=st.fit==='cover'?'66% 50%':'center';el.style.backgroundRepeat='no-repeat';el.innerHTML=''}
  else{el.style.backgroundImage='';el.style.backgroundSize='';const sv=$('.sable svg');
    if(sv)el.innerHTML=sv.outerHTML.replace(/id="(gl|cl|mn)"/g,'id="$1h"').replace(/url\(#(gl|cl|mn)\)/g,'url(#$1h)')}
}
function dpaint(){
  const v=+$('#dslide').value, d=DEPTH.find(x=>v<=x[0]);
  $('#pin').style.left=v+'%';
  $('#dout').innerHTML='<div class="big" style="margin-top:12px">'+d[1]+'</div><p style="margin:0 0 4px">'+d[2]+'</p><span class="tag a">'+d[3]+'</span><div style="margin-top:10px"><div class="barrow"><span class="n">p21 ↑</span><div class="bar"><i style="width:'+Math.max(6,v)+'%"></i></div><span class="v">&nbsp;</span></div><div class="barrow"><span class="n">Lamin B1 ↓</span><div class="bar"><i style="width:'+Math.max(6,100-v)+'%"></i></div><span class="v">&nbsp;</span></div></div><p class="tiny" style="margin:0">Directions follow the literature; the bar sizes are a drawing, not data.</p>';
}
function toyPaint(){
  const s=+$('#toy').value, a=100-s;
  $('#toyA').style.width=a+'%';$('#toyV').textContent=a;
  let h,t;
  if(a<=15){h='Outcome A: depth explains it';t='The leftover overlap is down at what depth alone gives. TCF4 would be a sign of depth.'}
  else if(a>=80){h='Outcome C: shared program';t='Removing depth barely changes the overlap. Both stresses switch on a program of their own.'}
  else{h='Outcome B: a mix';t='The overlap shrinks but stays above the depth-only level. The rest is a program candidate.'}
  $('#toyH').textContent=h;$('#toyT').textContent=t;
}

/* routing and render */
let cur='';
function show(id){
  if(!SECT.some(s=>s.id===id))id='start';
  cur=id;document.body.classList.toggle('on-start',id==='start');
  SECT.forEach(s=>{$('#v-'+s.id).classList.toggle('on',s.id===id)});
  const el=$('#v-'+id);setAcc(el,id);
  if(!el.dataset.r||id==='start'){el.innerHTML=V[id]();el.dataset.r=1;
    if(id==='papers'){plist();if(pendingRef){const n=pendingRef;pendingRef=0;const r=$('#plist .row[data-id="p'+n+'"]');if(r){r.classList.add('open');$('.rowhead',r).setAttribute('aria-expanded','true');setTimeout(()=>r.scrollIntoView({block:'center'}),20)}}}if(id==='terms'){tlist();calcs()}
    if(id==='start'){dpaint();heroPaint()} if(id==='method')toyPaint();
  }
  $$('.nb').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  $('#hsub').textContent=SUBS[id];
  const nb=$('.nb.on');if(nb&&nb.scrollIntoView)try{nb.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
  window.scrollTo(0,0);
}
function route(){show((location.hash||'').replace('#','')||'start')}
function go(id){if(location.hash==='#'+id)route();else location.hash=id}

$('#nav').innerHTML=SECT.map(s=>'<button class="nb" data-id="'+s.id+'" style="--c:'+s.c+'"><svg viewBox="0 0 24 24">'+s.ic+'</svg><span class="lb">'+s.label+'</span></button>').join('');
function applyBg(){
  const u=bgUrl(),b=$('#bgimg');
  if(u){b.style.backgroundImage='url("'+u+'")';b.classList.add('show');b.style.opacity=st.dim/100;document.body.classList.add('has-bg')}
  else{b.classList.remove('show');b.style.opacity='';document.body.classList.remove('has-bg')}
  document.body.classList.toggle('no-sable',!st.mascot);heroPaint();
}
let pendingRef=0;
function jumpTo(n){
  pf={f:'all',q:''};pendingRef=n;$('#v-papers').dataset.r='';go('papers');
}
function toggleTick(btn){
  const row=btn.closest('.row'),id=row.dataset.id,on=!st.done[id];
  if(on)st.done[id]=1;else delete st.done[id];
  btn.classList.toggle('on',on);btn.setAttribute('aria-pressed',on);
  save();setHead();
  const sec=cur;const s=$('[data-strip="'+sec+'"]');if(s){s.innerHTML=strip(sec);const p=prog(sec);s.previousElementSibling.querySelector('.r').textContent=p.d+' / '+p.n}
}
function toggleRow(h){const r=h.closest('.row'),o=r.classList.toggle('open');h.setAttribute('aria-expanded',o)}

document.addEventListener('click',e=>{
  const t=e.target;
  let x;
  if(x=t.closest('.nb')){go(x.dataset.id);return}
  if(x=t.closest('.cite')){e.preventDefault();jumpTo(+x.dataset.ref);return}
  if(x=t.closest('.tick')){e.stopPropagation();toggleTick(x);return}
  if(x=t.closest('.rowhead')){toggleRow(x);return}
  if(x=t.closest('#pchips .chip')){pf.f=x.dataset.f;$$('#pchips .chip').forEach(c=>c.classList.toggle('on',c===x));plist();return}
  if(x=t.closest('#tchips .chip')){tf.f=x.dataset.f;$$('#tchips .chip').forEach(c=>c.classList.toggle('on',c===x));tlist();return}
  if(t.id==='bgpick'){$('#bgfile').click();return}
  if(t.id==='bgclear'){ls.set(KBG,'none');applyBg();toast('Wallpaper removed');return}
  if(t.id==='bgfit'){st.fit=st.fit==='contain'?'cover':'contain';save();t.textContent=st.fit==='contain'?'Fill screen':'Show whole picture';heroPaint();return}
  if(t.id==='mascot'){st.mascot=!st.mascot;save();applyBg();t.textContent=st.mascot?'Hide Sable':'Show Sable';return}
  if(t.id==='bkmake'){$('#bk').value=JSON.stringify({v:1,done:Object.keys(st.done)});$('#bk').select();return}
  if(t.id==='bkcopy'){const v=$('#bk').value||JSON.stringify({v:1,done:Object.keys(st.done)});$('#bk').value=v;
    (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copied'),()=>{$('#bk').select();toast('Select and copy the text')});return}
  if(t.id==='bkrest'){try{const j=JSON.parse($('#bk').value);if(!Array.isArray(j.done))throw 0;st.done={};j.done.forEach(i=>st.done[i]=1);save();setHead();toast('Restored');$$('.view').forEach(v=>v.dataset.r='');show('start')}catch(err){toast('That text is not a valid backup')}return}
  if(t.id==='reset'){if(t.dataset.arm){st.done={};save();setHead();$$('.view').forEach(v=>v.dataset.r='');show('start');toast('Ticks cleared')}else{t.dataset.arm=1;t.textContent='Tap again to erase';setTimeout(()=>{if(t.isConnected){delete t.dataset.arm;t.textContent='Reset ticks'}},3000)}return}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.rowhead')){e.preventDefault();toggleRow(e.target)}
  if((e.key==='Enter')&&e.target.matches&&e.target.matches('.cite')){jumpTo(+e.target.dataset.ref)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='dslide')dpaint();
  else if(t.id==='toy')toyPaint();
  else if(t.id==='psearch'){pf.q=t.value;plist()}
  else if(t.id==='tsearch'){tf.q=t.value;tlist()}
  else if(t.id==='lfc'||t.id==='gn'||t.id==='al')calcs();
  else if(t.id==='dim'){st.dim=+t.value;$('#dimv').textContent=t.value;save();applyBg()}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='bgfile')return;
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{
    const m=1600,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const u=c.toDataURL('image/jpeg',.8);const ok=ls.set(KBG,u);applyBg();toast(ok?'Wallpaper set':'Wallpaper set for this visit only')};
    im.onerror=()=>toast('Could not read that image');im.src=rd.result};
  rd.readAsDataURL(f);e.target.value='';
});
window.addEventListener('hashchange',route);
applyBg();setHead();route();

</script>

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
}
